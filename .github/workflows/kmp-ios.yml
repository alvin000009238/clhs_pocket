name: KMP iOS Foundation

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'android/shared/**'
      - 'android/settings.gradle.kts'
      - 'android/build.gradle.kts'
      - 'iosApp/**'
      - '.github/workflows/kmp-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-build:
    name: Kotlin iOS framework and SwiftUI simulator build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK packages and XcodeGen
        run: |
          # macos-26 already includes modern Android command-line tools.
          # setup-android@v3 attempts to install the removed legacy 'tools' package.
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
          brew install xcodegen
          sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer
      - name: Kotlin/Native common tests and framework compilation
        working-directory: android
        run: |
          ./gradlew :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64 --no-configuration-cache --warning-mode all
      - name: Generate native Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build SwiftUI iOS simulator app (unsigned)
        run: |
          xcodebuild -project iosApp/CLHSPocket.xcodeproj -scheme CLHSPocket \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/pocket-ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Smoke-test native app launch on iOS Simulator
        timeout-minutes: 12
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next((d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone") and d.get("isAvailable", True)), ""))')"
          if [ -z "$DEVICE" ]; then
            echo "::error::No available iPhone simulator runtime on this runner"
            xcrun simctl list devices
            exit 1
          fi
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/pocket-ios-derived-data/Build/Products/Debug-iphonesimulator/CLHSPocket.app"
          xcrun simctl launch "$DEVICE" com.clhs.pocket.ios
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/pocket-ios-smoke.png"
      - name: Upload iOS simulator smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ios-smoke
          path: ${{ runner.temp }}/pocket-ios-smoke.png
          if-no-files-found: ignore
