name: Android Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate tag provenance and release notes
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 .github/scripts/release_guard.py provenance

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: false

      - name: Validate published versionCode history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_guard.py history

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing Android release signing secrets."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.jks"

          {
            echo "ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/android-signing/release.jks"
            echo "ANDROID_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build signed release APK
        working-directory: android
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon test :app:compileDebugAndroidTestKotlin assembleRelease \
            -PversionName="$version_name" \
            -PversionCode="${GITHUB_RUN_NUMBER}"

      - name: Prepare APK artifact
        run: |
          tag="${GITHUB_REF_NAME}"
          apk_name="clhs-pocket-${tag}-arm64-v8a-release.apk"
          apk_path="$RUNNER_TEMP/$apk_name"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk_path"
          echo "APK_PATH=$apk_path" >> "$GITHUB_ENV"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"

      - name: Verify APK identity, versions, signature and ABI
        run: python3 .github/scripts/release_guard.py verify

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
            --verify-tag \
            --title "CLHS Pocket $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-signing/release.jks"
