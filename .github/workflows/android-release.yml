name: Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate source provenance and release notes
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          python3 .github/scripts/release_guard.py provenance

      - name: Test release policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Validate Firebase distribution configuration
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CONFIGURED_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          CONFIGURED_FIREBASE_GROUP: ${{ vars.FIREBASE_DISTRIBUTION_GROUP }}
        run: |
          test -n "$FIREBASE_CREDENTIALS" || { echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON."; exit 1; }
          python3 .github/scripts/release_guard.py firebase-config

      - name: Authenticate Firebase distribution
        id: firebase-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: false

      - name: Validate GitHub and Firebase version history
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase-auth.outputs.access_token }}
        run: python3 .github/scripts/release_guard.py history

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Test, lint, and assemble Debug APK before signing
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:testDemoDebugUnitTest :app:testProductionDebugUnitTest --tests 'com.clhs.score.FlavorConfigurationTest' :app:lintDemoDebug :app:assembleDemoDebug :app:assembleProductionDebug --warning-mode all

      - name: Validate committed Baseline and Startup Profiles
        run: python3 .github/scripts/baseline_profiles.py android/app/src/productionRelease/generated/baselineProfiles

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing Android release signing secrets."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.jks"

          {
            echo "ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/android-signing/release.jks"
            echo "ANDROID_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:compileDemoDebugAndroidTestKotlin :app:assembleProductionRelease --warning-mode all \
            -PversionName="$RELEASE_VERSION_NAME" \
            -PversionCode="$RELEASE_VERSION_CODE"

      - name: Prepare APK artifact
        run: |
          apk_name="clhs-pocket-v${RELEASE_VERSION_NAME}-arm64-v8a-release.apk"
          apk_path="$RUNNER_TEMP/$apk_name"
          cp android/app/build/outputs/apk/production/release/app-production-release.apk "$apk_path"
          unzip -Z1 "$apk_path" | grep -Fx 'assets/dexopt/baseline.prof' > /dev/null
          echo "APK_PATH=$apk_path" >> "$GITHUB_ENV"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"

      - name: Verify APK identity, versions and ABI
        run: python3 .github/scripts/release_guard.py verify

      - name: Create GitHub Release
        if: env.RELEASE_CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
            --verify-tag \
            --title "CLHS Pocket $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Distribute dev APK to Firebase testers
        if: env.RELEASE_CHANNEL == 'dev'
        run: |
          node --version
          npx --yes firebase-tools@15.28.1 appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_GROUP" \
            --release-notes-file "$RUNNER_TEMP/release-notes.md" \
            --non-interactive

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-signing/release.jks"
