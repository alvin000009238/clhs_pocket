name: Android Baseline Profiles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate Baseline and Startup Profiles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Generate release Baseline and Startup Profiles
        working-directory: android
        run: ./gradlew --no-daemon :app:generateDemoReleaseBaselineProfile --warning-mode all

      - name: Validate and copy generated profiles
        run: |
          profile_dir=android/app/src/demoRelease/generated/baselineProfiles
          python3 .github/scripts/baseline_profiles.py "$profile_dir"
          destination=android/app/src/productionRelease/generated/baselineProfiles
          mkdir -p "$destination"
          cp "$profile_dir/baseline-prof.txt" "$profile_dir/startup-prof.txt" "$destination/"

      - name: Upload release profile sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-baseline-profiles-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/src/productionRelease/generated/baselineProfiles/baseline-prof.txt
            android/app/src/productionRelease/generated/baselineProfiles/startup-prof.txt
